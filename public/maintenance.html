<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AnonChat - Thoda Kaam Chal Raha Hai!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0B0C10;
      --card-base: #12131C;
      --border-slate: rgba(51, 65, 85, 0.6);
      --text-primary: #ffffff;
      --text-muted: #94a3b8;
      --accent-indigo: #4f46e5;
      --accent-indigo-hover: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    .top-ambient {
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 380px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12), transparent 70%);
    }
    .maintenance-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card-base);
      border: 1px solid var(--border-slate);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.75), 0 0 40px -10px rgba(245, 158, 11, 0.1);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
      margin-bottom: 20px;
    }
    .headline {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    .subtext {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 380px;
      margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-indigo);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .retry-btn:hover {
      background: var(--accent-indigo-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow top-ambient"></div>
  <main class="maintenance-card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span>Thoda Upgrade Chal Raha Hai</span>
    </div>
    <div class="icon-wrapper">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <h1 class="headline">Server Par Kaam Chal Raha Hai!</h1>
    <p class="subtext">AnonChat ko aur zyada smooth aur fast banane ke liye thoda maintenance chal raha hai. Tension mat lo, bas thodi der me wapas live aate hain!</p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      <span>Refresh Karke Dekho</span>
    </button>
  </main>
</body>
</html>
