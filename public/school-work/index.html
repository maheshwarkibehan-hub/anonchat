<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>School Work & Class Notes — AnonChat</title>
  
  <!-- Fonts: Instrument Serif, Inter, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="school-work.css?v=2.0.0" />
</head>
<body class="school-work-body">
  <div class="sw-ambient-glow" aria-hidden="true"></div>

  <!-- Top Navigation Header (Mobile-optimized sticky) -->
  <header class="sw-header">
    <div class="sw-header-left">
      <a href="/" class="sw-brand">
        AnonChat<sup>®</sup>
      </a>
      <a href="/" class="sw-back-link" title="Return to chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span class="sw-back-text">Chat</span>
      </a>
    </div>
    <div class="sw-header-right">
      <div class="sw-badge-pill">
        <span class="sw-live-dot"></span>
        <span>ACADEMIC REPO</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="sw-main">
    <!-- Breadcrumbs Navigation (Touch scrollable) -->
    <nav class="sw-breadcrumbs-wrap" aria-label="Breadcrumb navigation">
      <div class="sw-breadcrumbs" id="breadcrumbsNav">
        <button type="button" class="sw-crumb active" id="crumbSubjects" onclick="navigateToSubjects()">Subjects</button>
        <span class="sw-crumb-sep" id="crumbSep1" style="display:none;">/</span>
        <button type="button" class="sw-crumb" id="crumbSubject" style="display:none;" onclick="navigateToCurrentSubject()">Subject</button>
        <span class="sw-crumb-sep" id="crumbSep2" style="display:none;">/</span>
        <span class="sw-crumb active" id="crumbChapter" style="display:none;">Chapter</span>
      </div>
    </nav>

    <!-- Hero Header -->
    <div class="sw-hero" id="heroSection">
      <div class="sw-hero-eyebrow">Academic Archive</div>
      <h1 class="sw-hero-title" id="pageMainTitle">School Work &amp; Notes</h1>
      <p class="sw-hero-subtitle" id="pageMainSubtitle">
        Class lectures, handwritten summaries, and whiteboard notes categorized by subject and chapter.
      </p>
    </div>

    <!-- VIEW 1: Subjects Grid -->
    <section class="sw-view active" id="viewSubjects" aria-label="Subjects">
      <div class="sw-subjects-grid" id="subjectsGrid">
        <div class="sw-empty-state">
          <p class="sw-empty-desc">Loading subjects...</p>
        </div>
      </div>
    </section>

    <!-- VIEW 2: Chapters View -->
    <section class="sw-view" id="viewChapters" aria-label="Chapters">
      <div class="sw-chapters-header">
        <div class="sw-chapters-title-group">
          <span class="sw-code-badge" id="currentSubjectCode">PHY</span>
          <h2 class="sw-subject-name" id="currentSubjectName">Subject</h2>
          <p class="sw-subject-desc" id="currentSubjectDesc">Description</p>
        </div>
        <button type="button" class="sw-back-link" onclick="navigateToSubjects()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>All Subjects</span>
        </button>
      </div>

      <div class="sw-chapters-list" id="chaptersList">
        <!-- Dynamically injected chapters -->
      </div>
    </section>

    <!-- VIEW 3: Notes Gallery View -->
    <section class="sw-view" id="viewNotes" aria-label="Chapter Notes">
      <div class="sw-notes-header">
        <div class="sw-notes-title-group">
          <span class="sw-chapter-num-badge" id="currentChapterBadge">CH.01</span>
          <h2 class="sw-subject-name" id="currentChapterTitle">Chapter Title</h2>
          <p class="sw-subject-desc" id="currentChapterPagesCount">0 pages uploaded</p>
        </div>
        <button type="button" class="sw-back-link" onclick="navigateToCurrentSubject()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Chapters</span>
        </button>
      </div>

      <div class="sw-photos-grid" id="photosGrid">
        <!-- Dynamically injected photos -->
      </div>
    </section>
  </main>

  <!-- Fullscreen Lightbox Modal (Zoom, Pan, Swipe) -->
  <div class="sw-lightbox" id="lightboxModal" role="dialog" aria-modal="true" aria-label="Note viewer">
    <div class="sw-lightbox-header">
      <div class="sw-lightbox-meta">
        <span class="sw-lightbox-counter" id="lbCounter">1 / 1</span>
        <h3 class="sw-lightbox-title" id="lbTitle">Page 1</h3>
      </div>
      <div class="sw-lightbox-actions">
        <a id="lbDownloadBtn" download class="sw-icon-btn" title="Download Image">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </a>
        <button type="button" class="sw-icon-btn" onclick="closeLightbox()" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Lightbox Stage -->
    <div class="sw-lightbox-stage" id="lbStage">
      <button type="button" class="sw-nav-arrow sw-nav-prev" onclick="prevLightboxPhoto()" aria-label="Previous Page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="sw-lightbox-img-wrap" id="lbImgWrap">
        <img src="" alt="Note page" id="lbImage" class="sw-lightbox-img" />
      </div>

      <button type="button" class="sw-nav-arrow sw-nav-next" onclick="nextLightboxPhoto()" aria-label="Next Page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Floating Dock Controls (Safe-area aware) -->
    <div class="sw-lightbox-dock">
      <button type="button" class="sw-dock-btn" onclick="zoomLightbox(-0.25)" title="Zoom Out (-)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <span class="sw-dock-zoom-val" id="lbZoomVal">100%</span>
      <button type="button" class="sw-dock-btn" onclick="zoomLightbox(0.25)" title="Zoom In (+)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <button type="button" class="sw-dock-btn" onclick="resetLightboxZoom()" title="Reset Zoom">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modular Client Script -->
  <script src="school-work.js?v=2.0.0"></script>
</body>
</html>
